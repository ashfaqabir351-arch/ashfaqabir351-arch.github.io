let PV=[];
const bd=s=>s.replace(/[০-৯]/g,c=>"০১২৩৪৫৬৭৮৯".indexOf(c));
const LI=c=>{const k="ABCDabcdকখগঘ".indexOf(c);return k<0?-1:k%4};
const AR=/(?:ans(?:wer)?|উত্তর|সঠিক\s*উত্তর)\s*[:：=\-]?\s*\(?([A-Da-dকখগঘ])\)?/i;
function splitQ(txt){const t=txt.replace(/\r/g,"").trim(),re=/^[ \t]*(?:Q(?:uestion)?\.?\s*|প্রশ্ন\s*[:.-]?\s*)?[0-9০-৯]{1,3}\s*[.)।:]\s+/gm,ms=[...bd(t).matchAll(re)];if(!ms.length)return[t];return ms.map((m,k)=>t.slice(m.index+m[0].length,k+1<ms.length?ms[k+1].index:undefined).trim())}
function opts(b){const re=/(?:^|\s)\(?([A-Da-dকখগঘ])[.)]\s*/g;let need=0;const pos=[];for(const m of b.matchAll(re)){if(LI(m[1])==need){pos.push(m);if(++need==4)break}}return pos.length==4?pos:null}
function parseMCQ(b){let a=-1;const am=b.match(AR);if(am){a=LI(am[1]);b=b.slice(0,am.index)+b.slice(am.index+am[0].length)}const p=opts(b);if(!p)return{t:"mcq",q:b.trim(),o:["","","",""],a};const g=k=>b.slice(p[k].index+p[k][0].length,k<3?p[k+1].index:undefined).trim();return{t:"mcq",q:b.slice(0,p[0].index).trim(),o:[0,1,2,3].map(g),a}}
function parseCQ(b){const p=opts(b);if(!p)return{t:"cq",st:b.trim(),p:[1,2,3,4].map(k=>["",k,""])};const g=k=>b.slice(p[k].index+p[k][0].length,k<3?p[k+1].index:undefined).trim();return{t:"cq",st:b.slice(0,p[0].index).trim(),p:[0,1,2,3].map(k=>{let s=g(k),mk=k+1;const m=bd(s).match(/[\[\(]\s*(\d{1,2})\s*[\]\)]\s*$/);if(m){mk=+m[1];s=s.slice(0,m.index).trim()}return[s,mk,""]})}}
async function pdfText(f){try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let s="";for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();let y=null;for(const it of c.items){const yy=it.transform[5];s+=(y!==null&&Math.abs(yy-y)>3?"\n":" ")+it.str;y=yy}s+="\n"}if(!s.trim())alert("No text found in this PDF (it may be scanned). Paste the text instead.");return s}catch(e){alert("Couldn't read this PDF here. Paste the text instead.");return""}}

function imSave(){const out=[],bad=[],base=()=>({s:$("isb").value,t:$("ist").value,c:$("isc").value,b:$("isd").value.trim()||"Imported",f:[]});
